<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParisTalk – Chat in the City of Light</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="join-screen" class="screen">
    <div class="join-card">
      <div class="logo">🗼</div>
      <h1>ParisTalk</h1>
      <p class="tagline">Chat in the City of Light</p>
      <input id="username-input" type="text" placeholder="Enter your name…" maxlength="24" autocomplete="off">
      <button id="join-btn">Join Chat</button>
    </div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <header>
      <div class="header-left">
        <span class="logo-small">🗼</span>
        <h1>ParisTalk</h1>
      </div>
      <div class="header-right">
        <span id="user-count">1 online</span>
      </div>
    </header>

    <div id="messages"></div>

    <div class="input-bar">
      <input id="message-input" type="text" placeholder="Type a message…" maxlength="500" autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
